<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>보험라이브 — 준비 중</title>
<style>
:root{--accent:#6d3fd8;--dark:#2a2140;--soft:#f1ebfd}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#fff;color:var(--dark);font:16px/1.6 -apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;text-align:center;padding:24px}
.wm{display:inline-flex;align-items:center;gap:10px;font-size:40px;font-weight:800;letter-spacing:-1.5px}
.wm b{color:var(--accent)}.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--soft);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 10px rgba(109,63,216,0)}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
p{color:#8a8796;margin:18px 0 0}
</style></head>
<body><main><div class="wm"><span class="dot" aria-hidden="true"></span>보험<b>라이브</b></div>
<p>보험설계사들의 지금, 현장 이야기<br>곧 문을 엽니다.</p></main></body></html>
